name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test Nsqs.Tests/Nsqs.Tests.csproj -c Release

      - name: Build release
        run: dotnet build Nsqs/Nsqs.csproj -c Release

      - name: Publish portable (framework-dependent)
        run: dotnet publish Nsqs/Nsqs.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o publish
